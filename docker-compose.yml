# Composición local de EcommerceApi.
# La imagen se construye con el Dockerfile del repositorio (dos fases, sin root).
# El único dato de construcción es el token del feed, como secreto de BuildKit.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        # GitHub Packages exige token para restaurar LL.Security y LL.Hosting.
        # Se lee del entorno; no se guarda en la imagen ni en el repositorio.
        - github_token
    image: ecommerce-api:local
    ports:
      - "8080:8080"
    volumes:
      # La base SQLite vive en el volumen, no en la capa de la imagen.
      - api-data:/app/data
    restart: unless-stopped
    # Sin healthcheck: la imagen no trae cliente HTTP. Se comprueba desde el
    # host contra /health, que es anónimo (ADR-0006).

secrets:
  github_token:
    environment: GITHUB_TOKEN

volumes:
  api-data:
