version: 2
registries:
  github-packages:
    type: nuget-feed
    url: https://nuget.pkg.github.com/lanuzalorenzo/index.json
    username: lanuzalorenzo
    # Reproducción controlada del límite de Dependabot: el PR siguiente cambia
    # esta línea por ${{secrets.LL_PACKAGES_TOKEN}}. No debe quedarse en main.
    password: ${{secrets.GITHUB_TOKEN}}
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    registries:
      - github-packages
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "security"
    ignore:
      # Los paquetes LL.* viven en shared-dotnet; el rango 0.1.* los actualiza al
      # restaurar. Un salto de versión mayor es deliberado (ADR-0002 de shared-dotnet).
      - dependency-name: "LL.*"
        update-types:
          - "version-update:semver-major"
    groups:
      nuget-patch-minor:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
      nuget-major:
        patterns:
          - "*"
        update-types:
          - "major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "ci"
    groups:
      actions-patch-minor:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
      actions-major:
        patterns:
          - "*"
        update-types:
          - "major"
