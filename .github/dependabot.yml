version: 2
registries:
  github-packages:
    type: nuget-feed
    url: https://nuget.pkg.github.com/lanuzalorenzo/index.json
    username: lanuzalorenzo
    # Secreto de Dependabot con un PAT de solo lectura (read:packages).
    password: ${{secrets.LL_PACKAGES_TOKEN}}
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    registries:
      - github-packages
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "security"
    ignore:
      # Los paquetes LL.* se publican en shared-dotnet y su versión está fijada
      # en Directory.Packages.props: un parche o una minor abre PR. Un salto
      # mayor es deliberado y se revisa a mano.
      - dependency-name: "LL.*"
        update-types:
          - "version-update:semver-major"
    groups:
      nuget-patch-minor:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
      nuget-major:
        patterns:
          - "*"
        update-types:
          - "major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "ci"
    groups:
      actions-patch-minor:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
      actions-major:
        patterns:
          - "*"
        update-types:
          - "major"
