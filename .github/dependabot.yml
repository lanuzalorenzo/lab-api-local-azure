version: 2
registries:
  github-packages:
    type: nuget-feed
    url: https://nuget.pkg.github.com/lanuzalorenzo/index.json
    username: lanuzalorenzo
    # Secreto de Dependabot con un PAT de solo lectura (read:packages).
    password: ${{secrets.LL_PACKAGES_TOKEN}}
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    registries:
      - github-packages
    schedule:
      interval: "weekly"
      day: "monday"
    # Una versión retirada a los dos días no llega a entrar.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "security"
    ignore:
      # Los paquetes LL.* se publican en shared-dotnet y su versión está fijada
      # en Directory.Packages.props: un parche o una minor abre PR. Un salto
      # mayor es deliberado y se revisa a mano.
      - dependency-name: "LL.*"
        update-types:
          - "version-update:semver-major"
      # La familia de plataforma sigue al TargetFramework. Un mayor es una
      # migración (core/docs/versiones-y-dependencias.md), no una actualización.
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "Microsoft.Extensions.*"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "Microsoft.EntityFrameworkCore.*"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "Microsoft.Data.Sqlite"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "Microsoft.Authentication.WebAssembly.Msal"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "Microsoft.JSInterop"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "System.Security.Cryptography.Pkcs"
        update-types:
          - "version-update:semver-major"
      # Swashbuckle 11 exige Microsoft.OpenApi 3.x y la plataforma lo limita a
      # 2.x; el restore falla con NU1107 hasta la migración a .NET 12.
      - dependency-name: "Swashbuckle.AspNetCore"
        update-types:
          - "version-update:semver-major"
    groups:
      nuget-patch-minor:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
      nuget-major:
        patterns:
          - "*"
        update-types:
          - "major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Una versión retirada a los dos días no llega a entrar.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "ci"
    groups:
      # core queda fuera de los grupos: al agrupar, todas sus referencias se
      # fijan a la versión objetivo del grupo y el cooldown de siete días puede
      # dejar esa versión por detrás de una referencia fijada a mano
      # (check-platform@v1.8 frente a v1.7), con lo que se rebaja a una etiqueta
      # donde la acción puede no existir. Pasó en la PR #83 y el CI lo frenó.
      actions-patch-minor:
        patterns:
          - "*"
        exclude-patterns:
          - "lanuzalorenzo/core*"
        update-types:
          - "patch"
          - "minor"
      actions-major:
        patterns:
          - "*"
        exclude-patterns:
          - "lanuzalorenzo/core*"
        update-types:
          - "major"
