name: Imagen de la API

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: imagen-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  publish:
    name: Construir y publicar la imagen
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.imagen.outputs.digest }}
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Construir y publicar
        id: imagen
        uses: lanuzalorenzo/core/actions/container-publish@v1.4
        with:
          image: ${{ github.repository_owner }}/ecommerceapi
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          push: ${{ github.event_name != 'pull_request' }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Anotar el digest
        run: |
          echo "Digest de la imagen: ${{ steps.imagen.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  sbom:
    name: SBOM CycloneDX del artefacto
    needs: [ publish ]
    if: github.event_name != 'pull_request' && needs.publish.outputs.digest != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Generar el SBOM del artefacto publicado
        # Fijada por SHA; el comentario dice la etiqueta que corresponde.
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/${{ github.repository_owner }}/ecommerceapi@${{ needs.publish.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: cyclonedx-json
          output-file: ecommerceapi.cdx.json
          artifact-name: ecommerceapi-${{ github.sha }}.cdx.json
          upload-release-assets: false

      - name: Anotar el SHA-256 del SBOM
        run: |
          echo "SHA-256 del SBOM: $(sha256sum ecommerceapi.cdx.json | cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"

  sign:
    name: Firmar y atestar el artefacto
    needs: [ publish, sbom ]
    if: github.event_name != 'pull_request' && needs.publish.outputs.digest != ''
    runs-on: ubuntu-latest
    permissions:
      packages: write
      id-token: write
    steps:
      - name: Descargar el SBOM
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ecommerceapi-${{ github.sha }}.cdx.json
          path: sbom

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Instalar cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - name: Firmar la imagen
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/ecommerceapi@${{ needs.publish.outputs.digest }}
        run: cosign sign --yes "$IMAGE"

      - name: Atestar el SBOM
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/ecommerceapi@${{ needs.publish.outputs.digest }}
        run: cosign attest --yes --predicate "sbom/ecommerceapi-${{ github.sha }}.cdx.json" --type cyclonedx "$IMAGE"

      - name: Verificar firma y atestación
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/ecommerceapi@${{ needs.publish.outputs.digest }}
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/container-publish.yml@${{ github.ref }}
          ISSUER: https://token.actions.githubusercontent.com
        run: |
          cosign verify \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer "$ISSUER" \
            "$IMAGE"
          cosign verify-attestation \
            --type cyclonedx \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer "$ISSUER" \
            "$IMAGE"
