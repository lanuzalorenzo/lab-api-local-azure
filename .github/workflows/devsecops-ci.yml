name: DevSecOps CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devsecops-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Compilación, formato y pruebas (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true

      - name: Restaurar dependencias
        run: |
          dotnet restore EcommerceApi/EcommerceApi.csproj
          dotnet restore tests/EcommerceApi.Tests/EcommerceApi.Tests.csproj

      - name: Compilar en Release
        run: dotnet build EcommerceApi/EcommerceApi.csproj -c Release --no-restore

      - name: Verificar formato
        run: |
          dotnet format EcommerceApi/EcommerceApi.csproj --verify-no-changes --no-restore
          dotnet format tests/EcommerceApi.Tests/EcommerceApi.Tests.csproj --verify-no-changes --no-restore

      - name: Ejecutar pruebas de integración
        run: >
          dotnet test tests/EcommerceApi.Tests/EcommerceApi.Tests.csproj
          -c Release --no-restore
          --logger "trx;LogFileName=test-results.trx"

      - name: Publicar resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/EcommerceApi.Tests/TestResults/test-results.trx
          if-no-files-found: ignore

  secret-scanning:
    name: Detección de secretos (historial completo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks

      - name: Escanear secretos con Gitleaks
        run: gitleaks detect --source . --redact --verbose --exit-code 2

  sast:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
          queries: security-extended

      - name: Compilar para CodeQL
        uses: github/codeql-action/autobuild@v3

      - name: Analizar con CodeQL
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:csharp'

  sca:
    name: SCA (dependencias NuGet)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true

      - name: Restaurar y compilar para generar los manifiestos de dependencias
        run: |
          dotnet restore EcommerceApi/EcommerceApi.csproj
          dotnet restore tests/EcommerceApi.Tests/EcommerceApi.Tests.csproj
          dotnet build EcommerceApi/EcommerceApi.csproj -c Release --no-restore
          dotnet build tests/EcommerceApi.Tests/EcommerceApi.Tests.csproj -c Release --no-restore

      - name: Escanear dependencias con Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          skip-dirs: '**/.git'
          format: 'sarif'
          output: 'trivy-fs.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      - name: Publicar hallazgos SCA
        if: always() && hashFiles('trivy-fs.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-fs.sarif'
          category: 'trivy-fs'

  container-security:
    name: Hardening y escaneo de contenedor
    runs-on: ubuntu-latest
    needs: [ build-and-test ]
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Construir imagen de contenedor
        run: docker build -t ecommerce-api:${GITHUB_SHA} -f Dockerfile .

      - name: Verificar que el contenedor no ejecuta como root
        run: |
          container_uid="$(docker run --rm --entrypoint id ecommerce-api:${GITHUB_SHA} -u)"
          echo "UID del contenedor: ${container_uid}"
          test "${container_uid}" != "0"

      - name: Escanear imagen con Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'ecommerce-api:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-image.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      - name: Publicar hallazgos de la imagen
        if: always() && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-image.sarif'
          category: 'trivy-image'

  iac-security:
    name: Seguridad de infraestructura como código (Bicep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar Bicep
        run: |
          curl -sSL -o /usr/local/bin/bicep https://github.com/Azure/bicep/releases/download/v0.48.1/bicep-linux-x64
          chmod +x /usr/local/bin/bicep
          bicep --version

      - name: Compilar plantilla Bicep
        run: bicep build infra/main.bicep --outfile infra/main.json

      - name: Escanear infraestructura con Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'config'
          scan-ref: 'infra'
          format: 'sarif'
          output: 'trivy-config.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          trivyignores: '.trivyignore'

      - name: Publicar hallazgos de IaC
        if: always() && hashFiles('trivy-config.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-config.sarif'
          category: 'trivy-config'

  dependency-review:
    name: Revisión de dependencias (solo PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Revisar cambios de dependencias
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
