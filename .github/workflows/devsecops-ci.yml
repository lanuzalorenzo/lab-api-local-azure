name: DevSecOps CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devsecops-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Compilación, formato y pruebas (.NET 10)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Compilar, verificar formato y probar
        uses: lanuzalorenzo/core/actions/dotnet@v1.3
        with:
          solution: EcommerceApi.sln
          dotnet-version: '10.0.x'

  secret-scanning:
    name: Detección de secretos (historial completo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Escanear secretos con Gitleaks
        uses: lanuzalorenzo/core/actions/gitleaks@v1.3

  sast:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Configurar .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          queries: security-extended

      - name: Compilar para CodeQL
        uses: github/codeql-action/autobuild@v4

      - name: Analizar con CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:csharp'

  sca:
    name: SCA (dependencias NuGet)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Configurar .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar y compilar para generar los manifiestos de dependencias
        run: |
          dotnet restore EcommerceApi.sln
          dotnet build EcommerceApi.sln -c Release --no-restore

      - name: Escanear dependencias con Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: 'v0.76.0'
          scan-type: 'fs'
          scan-ref: '.'
          skip-dirs: '**/.git'
          format: 'sarif'
          output: 'trivy-fs.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true
          limit-severities-for-sarif: 'true'

      - name: Publicar hallazgos SCA
        if: always() && hashFiles('trivy-fs.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-fs.sarif'
          category: 'trivy-fs'

  container-security:
    name: Hardening y escaneo de contenedor
    runs-on: ubuntu-latest
    needs: [ build-and-test ]
    permissions:
      contents: read
      packages: read
      security-events: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Construir imagen de contenedor
        run: >
          docker build
          --secret id=github_token,env=GH_PACKAGES_TOKEN
          -t ecommerce-api:${GITHUB_SHA}
          -f Dockerfile .

      - name: Verificar que el contenedor no ejecuta como root
        run: |
          container_uid="$(docker run --rm --entrypoint id ecommerce-api:${GITHUB_SHA} -u)"
          echo "UID del contenedor: ${container_uid}"
          test "${container_uid}" != "0"

      - name: Escanear imagen con Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: 'v0.76.0'
          image-ref: 'ecommerce-api:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-image.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true
          limit-severities-for-sarif: 'true'

      - name: Publicar hallazgos de la imagen
        if: always() && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-image.sarif'
          category: 'trivy-image'

  iac-security:
    name: Seguridad de infraestructura como código (Bicep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Instalar Bicep
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$HOME/.local/bin"
          # La API de GitHub sirve el binario cuando el CDN de releases
          # devuelve 504; la URL directa queda como respaldo.
          if ! gh release download v0.48.1 --repo Azure/bicep \
              --pattern bicep-linux-x64 --output "$HOME/.local/bin/bicep"; then
            echo "::warning::La API no devolvio el binario; se intenta la URL de releases."
            curl -sSL -o "$HOME/.local/bin/bicep" https://github.com/Azure/bicep/releases/download/v0.48.1/bicep-linux-x64
          fi
          chmod +x "$HOME/.local/bin/bicep"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/bicep" --version

      - name: Compilar plantilla Bicep
        run: bicep build infra/main.bicep --outfile infra/main.json

      - name: Escanear infraestructura con Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: 'v0.76.0'
          scan-type: 'config'
          scan-ref: 'infra'
          format: 'sarif'
          output: 'trivy-config.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          trivyignores: '.trivyignore'
          limit-severities-for-sarif: 'true'

      - name: Publicar hallazgos de IaC
        if: always() && hashFiles('trivy-config.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-config.sarif'
          category: 'trivy-config'

  dependency-review:
    name: Revisión de dependencias (solo PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Revisar cambios de dependencias
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
