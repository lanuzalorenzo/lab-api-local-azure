name: DevSecOps CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devsecops-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Compilación, formato y pruebas (.NET 10)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Compilar, verificar formato y probar
        uses: lanuzalorenzo/core/actions/dotnet@v1.4
        with:
          solution: EcommerceApi.sln
          dotnet-version: '10.0.x'

  secret-scanning:
    name: Detección de secretos (historial completo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Escanear secretos con Gitleaks
        uses: lanuzalorenzo/core/actions/gitleaks@v1.4

  sast:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Analizar con la acción compartida
        # Acción compartida de core, fijada a v1.6.
        uses: lanuzalorenzo/core/actions/sast@v1.6
        with:
          languages: csharp
          queries: security-extended
          category: '/language:csharp'

  sca:
    name: SCA (dependencias NuGet)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Configurar .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar y compilar para generar los manifiestos de dependencias
        run: |
          dotnet restore EcommerceApi.sln
          dotnet build EcommerceApi.sln -c Release --no-restore

      - name: Escanear dependencias con la acción compartida
        # Acción compartida de core, fijada a v1.6.
        uses: lanuzalorenzo/core/actions/scan@v1.6
        with:
          scan-type: fs
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true
          output: trivy-fs.sarif
          category: trivy-fs

  container-security:
    name: Hardening y escaneo de contenedor
    runs-on: ubuntu-latest
    needs: [ build-and-test ]
    permissions:
      contents: read
      packages: read
      security-events: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Construir imagen de contenedor
        run: >
          docker build
          --secret id=github_token,env=GH_PACKAGES_TOKEN
          -t ecommerce-api:${GITHUB_SHA}
          -f Dockerfile .

      - name: Verificar que el contenedor no ejecuta como root
        run: |
          container_uid="$(docker run --rm --entrypoint id ecommerce-api:${GITHUB_SHA} -u)"
          echo "UID del contenedor: ${container_uid}"
          test "${container_uid}" != "0"

      - name: Escanear imagen con la acción compartida
        # Acción compartida de core, fijada a v1.6.
        uses: lanuzalorenzo/core/actions/scan@v1.6
        with:
          scan-type: image
          image-ref: 'ecommerce-api:${{ github.sha }}'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true
          output: trivy-image.sarif
          category: trivy-image

      - name: Verificar que la API no publica la cabecera Server
        run: |
          docker run -d --name server-header-probe -p 8080:8080 "ecommerce-api:${GITHUB_SHA}"
          trap 'docker rm -f server-header-probe >/dev/null 2>&1 || true' EXIT
          healthy=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health >/dev/null 2>&1; then
              healthy=1
              break
            fi
            sleep 1
          done
          test "${healthy}" = 1
          scripts/check-server-header.sh http://localhost:8080/health

  iac-security:
    name: Seguridad de infraestructura como código (Bicep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Instalar Bicep
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$HOME/.local/bin"
          # La API de GitHub sirve el binario cuando el CDN de releases
          # devuelve 504; la URL directa queda como respaldo.
          if ! gh release download v0.48.1 --repo Azure/bicep \
              --pattern bicep-linux-x64 --output "$HOME/.local/bin/bicep"; then
            echo "::warning::La API no devolvio el binario; se intenta la URL de releases."
            curl -sSL -o "$HOME/.local/bin/bicep" https://github.com/Azure/bicep/releases/download/v0.48.1/bicep-linux-x64
          fi
          chmod +x "$HOME/.local/bin/bicep"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/bicep" --version

      - name: Compilar plantilla Bicep
        run: bicep build infra/main.bicep --outfile infra/main.json

      - name: Escanear infraestructura con la acción compartida
        # Acción compartida de core, fijada a v1.6.
        uses: lanuzalorenzo/core/actions/scan@v1.6
        with:
          scan-type: config
          scan-ref: infra
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          output: trivy-config.sarif
          category: trivy-config
          trivyignores: .trivyignore

  dependency-review:
    name: Revisión de dependencias (solo PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Revisar cambios de dependencias
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
