<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Arquitectura de EcommerceApi: capas, identidad, persistencia y consumidor asíncrono</title>
  <desc id="descripcion">El cliente llama a la API con un JWT que valida Entra ID. La API usa Application y Domain; Application guarda en SQLite y escribe en el outbox, que publica hacia la Function idempotente. La API envía telemetría a Application Insights y GitHub Actions la construye y analiza.</desc>
